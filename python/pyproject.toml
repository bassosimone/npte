[project]
name = "npte"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pyright>=1.1.411",
    "ruff>=0.15.20",
]

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

# Flat layout: the npte module sits next to pyproject.toml, not under src/.
[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
